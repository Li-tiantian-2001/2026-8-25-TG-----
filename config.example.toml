# TG 频道自动化机器人 · 配置示例（脱敏）
# 复制为 config.toml 后填入真实值

[telegram]
api_id = 0            # my.telegram.org 申请的 api_id
api_hash = ""         # my.telegram.org 申请的 api_hash
session = "tgbot_session"

[download]
# VK + X 的 cookies（Netscape 格式），放在项目根目录
cookies_file = "cookies.txt"
temp_dir = ""
max_file_mb = 3800
format = "best[ext=mp4]/bestvideo[ext=mp4]+bestaudio[ext=m4a]/bestvideo+bestaudio/best"
retries = 5
socket_timeout = 60

[upload]
min_interval_sec = 60
daily_cap = 30
upload_timeout_sec = 1800
caption_prefix = ""

[storage]
db_path = "tgbot.db"
disk_watermark_pct = 80
cleanup_interval_sec = 3600
temp_max_age_sec = 21600

[follow]
enabled = true
# 允许搬运的媒体类型：video=视频, photo=图片
allow_media = ["video", "photo"]
# 是否屏蔽"转发自其他频道"的帖子（可能是广告）
block_forwarded = false
# 广告关键词黑名单（原文案命中即屏蔽）
# 误伤严重时把 ad_min_hits 调成 2 或 3（要求同一文案命中多个词才算广告）
ad_min_hits = 1
ad_keywords = ["群组", "频道", "视频", "音乐", "必备", "搜索", "公开", "实力", "直播", "内幕", "数据", "精准", "备用", "体育", "存款", "微信", "支付宝", "银行卡", "客服", "经理", "官方", "品牌", "信赖", "真人", "无忧", "提款", "大额", "抽奖", "短句", "上头", "精选", "系列", "t.me", "http", "@","短剧", "洗浴", "全国", "代理", "圈子", "会员", "内容", "付费", "资源", "链接", "详情", "议价", "推荐", "入圈", "梯子", "套餐", "vpn", "https", "实测", "退款", "退费", "下注", "一注"]
# 广告域名黑名单（正文/文案里出现这些域名的链接即屏蔽）
ad_domains = []

target_channel = ""
